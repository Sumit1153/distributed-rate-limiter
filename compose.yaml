services:
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 2s
      retries: 10
    volumes:
      - redisdata:/data
    networks: [internal]
  backend:
    build: .
    command: ["node", "backend/server.js"]
    environment:
      PORT: 3001
    networks: [internal]
  gateway:
    build: .
    command: ["node", "src/server.js"]
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      PORT: 8080
      REDIS_URL: redis://redis:6379
      BACKEND_URL: http://backend:3001
      RATE_LIMIT_ALGORITHM: ${RATE_LIMIT_ALGORITHM:-token_bucket}
      RATE_LIMIT_CAPACITY: ${RATE_LIMIT_CAPACITY:-5}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-10000}
      REDIS_TIMEOUT_MS: 500
      ALLOW_DEMO_ALGORITHM_SWITCH: ${ALLOW_DEMO_ALGORITHM_SWITCH:-true}
    networks: [internal]
networks:
  internal: {}
volumes:
  redisdata: {}
